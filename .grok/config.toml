# Google Growth — project-scoped MCP for Grok Build
# https://github.com/Geoking2104/google-growth
#
# Load order: Grok walks from cwd up to git root and reads each .grok/config.toml
# Project entries override user-level servers with the same name.
#
# Required env (set in your shell or secrets manager):
#   GOOGLE_APPLICATION_CREDENTIALS  or  GOOGLE_CREDENTIALS_JSON
# Optional:
#   GA4_PROPERTY_ID
#   PAGESPEED_API_KEY / CRUX_API_KEY / GOOGLE_API_KEY
#   REDIS_URL
# Writes stay DISABLED unless the matching flag is exactly "true":
#   GA4_WRITE_ENABLED / GTM_WRITE_ENABLED
#   SEARCH_CONSOLE_WRITE_ENABLED / INDEXING_WRITE_ENABLED
#
# Hosted/deployed option: point Grok Connectors or the Remote MCP Tools API at the
# public HTTPS URL (https://<host>/mcp) with header: Authorization: Bearer <MCP_API_TOKEN>.

[mcp_servers.google-growth]
command = "node"
args = ["dist/index.js", "--transport", "stdio"]
startup_timeout_sec = 45
tool_timeout_sec = 600
env = {
  GOOGLE_APPLICATION_CREDENTIALS = "${GOOGLE_APPLICATION_CREDENTIALS}",
  GOOGLE_CREDENTIALS_JSON = "${GOOGLE_CREDENTIALS_JSON}",
  GA4_PROPERTY_ID = "${GA4_PROPERTY_ID}",
  PAGESPEED_API_KEY = "${PAGESPEED_API_KEY}",
  CRUX_API_KEY = "${CRUX_API_KEY}",
  GOOGLE_API_KEY = "${GOOGLE_API_KEY}",
  REDIS_URL = "${REDIS_URL}",
  GA4_WRITE_ENABLED = "${GA4_WRITE_ENABLED:-false}",
  GTM_WRITE_ENABLED = "${GTM_WRITE_ENABLED:-false}",
  SEARCH_CONSOLE_WRITE_ENABLED = "${SEARCH_CONSOLE_WRITE_ENABLED:-false}",
  INDEXING_WRITE_ENABLED = "${INDEXING_WRITE_ENABLED:-false}",
  TRANSPORT = "stdio",
}
